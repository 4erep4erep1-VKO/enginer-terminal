<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0E17"/>
      <stop offset="100%" stopColor="#05070B"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22D3EE"/>
      <stop offset="50%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>
    <linearGradient id="sparkAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#67E8F9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Diagnostic Stator Ring / Gear Teeth Accents -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanAccent)" stroke-width="6" stroke-dasharray="24 16" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.35"/>

  <!-- Minimalist Hexagon Core -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" fill="#0E1422" stroke="url(#cyanAccent)" stroke-width="8" stroke-linejoin="round"/>

  <!-- High-Precision Diagonal Mechanic Wrench Icon -->
  <g filter="url(#neonGlow)">
    <!-- Wrench Shaft -->
    <line x1="160" y1="352" x2="330" y2="182" stroke="url(#sparkAccent)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Wrench Closed Ring Eye (Bottom-Left) -->
    <circle cx="152" cy="360" r="32" fill="#0B0E17" stroke="url(#sparkAccent)" stroke-width="18"/>
    <circle cx="152" cy="360" r="12" fill="#22D3EE"/>

    <!-- Wrench Open Jaw Head (Top-Right) -->
    <path d="M 310,140 L 372,202 C 388,186 392,162 384,142 L 350,142 L 342,108 C 322,100 298,104 282,120 Z" fill="url(#sparkAccent)"/>
  </g>

  <!-- Real-time Diagnostic Pulse (Oscilloscope Telemetry Line) -->
  <path d="M 124 256 L 190 256 L 220 200 L 256 312 L 292 216 L 322 268 L 350 256 L 388 256" 
        stroke="#67E8F9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Center Status Spark Node -->
  <circle cx="256" cy="312" r="8" fill="#FFFFFF"/>
  <circle cx="220" cy="200" r="6" fill="#FFFFFF"/>
</svg>
