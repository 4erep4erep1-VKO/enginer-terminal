<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="brightCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Full-bleed Background for Android & iOS home screen -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Subtle Blueprint Grid Pattern inside safe zone -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="128" y1="64" x2="128" y2="448" stroke-dasharray="4 8"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="4 8"/>
    <line x1="384" y1="64" x2="384" y2="448" stroke-dasharray="4 8"/>
    <line x1="64" y1="128" x2="448" y2="128" stroke-dasharray="4 8"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="4 8"/>
    <line x1="64" y1="384" x2="448" y2="384" stroke-dasharray="4 8"/>
  </g>

  <!-- Outer Rounded Tech Housing Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="56" cy="56" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="456" cy="56" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="56" cy="456" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="456" cy="456" r="5" fill="#38bdf8" opacity="0.8"/>

  <!-- Rotating Gear / Diagnostic Stator Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="28 14" stroke-linecap="round" opacity="0.75"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- Heavy Hexagon Core (Service Shield) -->
  <polygon points="256,104 384,178 384,326 256,400 128,326 128,178" 
           fill="#0b1329" stroke="url(#cyanGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Precision Wrench Instrument -->
  <g filter="url(#glow)">
    <!-- Wrench Shaft -->
    <line x1="168" y1="344" x2="328" y2="184" stroke="url(#brightCyan)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Closed Ring (Bottom-Left) -->
    <circle cx="160" cy="352" r="30" fill="#0b1329" stroke="url(#brightCyan)" stroke-width="16"/>
    <circle cx="160" cy="352" r="11" fill="#38bdf8"/>

    <!-- Open Jaw Head (Top-Right) -->
    <path d="M 312,144 L 368,200 C 384,184 388,162 380,144 L 350,144 L 344,114 C 326,106 304,110 288,126 Z" fill="url(#brightCyan)"/>
  </g>

  <!-- Real-time Oscilloscope Telemetry Line (ECU / Diagnostics Wave) -->
  <path d="M 134 256 L 194 256 L 222 204 L 256 308 L 290 220 L 318 268 L 346 256 L 378 256" 
        stroke="#67e8f9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Active Telemetry Sensor Spark Nodes -->
  <circle cx="256" cy="308" r="7" fill="#ffffff"/>
  <circle cx="222" cy="204" r="5" fill="#ffffff"/>
</svg>